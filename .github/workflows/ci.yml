name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate environment contract
        run: npm run check:env

      - name: Security audit
        run: npm audit --audit-level=high

      # Also performs a production build and starts a temporary server, so a
      # Linux build (the same OS Vercel uses) is verified on every change.
      - name: Build and regression tests
        run: npm test
